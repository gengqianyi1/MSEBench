[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msebench"
version = "0.2.0"
description = "MSEBench unified LLM evaluation benchmark engine"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6", "jsonschema>=4"]

[project.optional-dependencies]
local = ["harbor==0.21.0"]
test = ["pytest>=8", "numpy>=1.26", "scipy>=1.11", "rdkit>=2024.3.1", "psutil>=5", "requests>=2"]

[project.scripts]
msebench = "msebench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["msebench", "msebench.*", "msebench_harness", "msebench_harness.*"]

[tool.setuptools.package-data]
msebench = ["default_profile.json", "schemas/*.json", "templates/**/*"]
