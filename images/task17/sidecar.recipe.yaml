  # buildkit'
- USER mambauser
- WORKDIR /tmp
- 'COPY _apptainer_shell.sh /usr/local/bin/_apptainer_shell.sh # buildkit'
- 'COPY _entrypoint.sh /usr/local/bin/_entrypoint.sh # buildkit'
- 'COPY _activate_current_env.sh /usr/local/bin/_activate_current_env.sh # buildkit'
- ENTRYPOINT ["/usr/local/bin/_entrypoint.sh"]
- CMD ["/bin/bash"]
- 'COPY _dockerfile_shell.sh /usr/local/bin/_dockerfile_shell.sh # buildkit'
- SHELL [/usr/local/bin/_dockerfile_shell.sh]
- ARG TASK_DIR=tasks/task-17-spherical-agglomeration
- ARG TASK_NUMBER=17
- ARG PORT=8717
- 'COPY --chown=mambauser:mambauser tasks/task-17-spherical-agglomeration/tests/environment.lock.yml /tmp/environment.lock.yml # buildkit'
- 'RUN |3 TASK_DIR=tasks/task-17-spherical-agglomeration TASK_NUMBER=17 PORT=8717 /usr/local/bin/_dockerfile_shell.sh micromamba create -y -n chembench -f /tmp/environment.lock.yml && micromamba clean --all
  --yes # buildkit'
- ENV PATH=/opt/conda/envs/chembench/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
- ENV MAMBA_DEFAULT_ENV=chembench
- USER root
- 'RUN |3 TASK_DIR=tasks/task-17-spherical-agglomeration TASK_NUMBER=17 PORT=8717 /usr/local/bin/_dockerfile_shell.sh mkdir -p /snapshot /srv && chown -R $MAMBA_USER:$MAMBA_USER /snapshot /srv # buildkit'
- USER mambauser
- 'COPY --chown=mambauser:mambauser tasks/task-17-spherical-agglomeration/tests/task_snapshot/ /snapshot/ # buildkit'
- 'COPY --chown=mambauser:mambauser templates/sidecar/private_response_server.py /srv/private_response_server.py # buildkit'
- ENV CHEMBENCH_SIDECAR_TASK_NUMBER=17
- ENV CHEMBENCH_SIDECAR_PORT=8717
- EXPOSE [8717/tcp]
- CMD ["sh" "-c" "exec python /srv/private_response_server.py --task-number ${CHEMBENCH_SIDECAR_TASK_NUMBER} --snapshot /snapshot --host 0.0.0.0 --port ${CHEMBENCH_SIDECAR_PORT}"]
