- ENV MAMBA_ROOT_PREFIX=/opt/conda
- ENV MAMBA_EXE=/bin/micromamba
- ENV CONDA_OVERRIDE_CUDA=
- 'COPY /bin/micromamba /bin/micromamba # buildkit'
- 'COPY /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-certificates.crt # buildkit'
- 'COPY _dockerfile_initialize_user_accounts.sh /usr/local/bin/_dockerfile_initialize_user_accounts.sh # buildkit'
- 'COPY _dockerfile_setup_root_prefix.sh /usr/local/bin/_dockerfile_setup_root_prefix.sh # buildkit'
- 'RUN |4 CERT_SOURCE=/etc/ssl/certs/ca-certificates.crt MAMBA_USER=mambauser MAMBA_USER_ID=57439 MAMBA_USER_GID=57439 /bin/sh -c /usr/local/bin/_dockerfile_initialize_user_accounts.sh     && /usr/local/bin/_dockerfile_setup_root_prefix.sh
  # buildkit'
- USER mambauser
- WORKDIR /tmp
- 'COPY _apptainer_shell.sh /usr/local/bin/_apptainer_shell.sh # buildkit'
- 'COPY _entrypoint.sh /usr/local/bin/_entrypoint.sh # buildkit'
- 'COPY _activate_current_env.sh /usr/local/bin/_activate_current_env.sh # buildkit'
- ENTRYPOINT ["/usr/local/bin/_entrypoint.sh"]
- CMD ["/bin/bash"]
- 'COPY _dockerfile_shell.sh /usr/local/bin/_dockerfile_shell.sh # buildkit'
- SHELL [/usr/local/bin/_dockerfile_shell.sh]
- 'COPY --chown=mambauser:mambauser environment.lock.yml /tmp/environment.lock.yml # buildkit'
- 'COPY wheels/pyscf-2.8.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl /tmp/pyscf-2.8.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl # buildkit'
- 'RUN /usr/local/bin/_dockerfile_shell.sh sed ''/^- pyscf=/d'' /tmp/environment.lock.yml > /tmp/environment.nopyscf.yml &&     micromamba create -y -n chembench -f /tmp/environment.nopyscf.yml &&     echo
  ''4BAA59297DE8A2992E8AFA5B20A12164B6128C14CCC09431D05F73E3EEFDF008  /tmp/pyscf-2.8.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl'' | sha256sum -c - &&     micromamba run -n chembench python
  -m pip install --no-cache-dir /tmp/pyscf-2.8.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl &&     micromamba clean --all --yes # buildkit'
- ENV PATH=/opt/conda/envs/chembench/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
- ENV MAMBA_DEFAULT_ENV=chembench
- USER root
- 'RUN /usr/local/bin/_dockerfile_shell.sh mkdir -p /workspace /logs/agent /logs/artifacts /logs/verifier && chown -R $MAMBA_USER:$MAMBA_USER /workspace /logs # buildkit'
- USER mambauser
- WORKDIR /workspace
- 'COPY --chown=mambauser:mambauser public/ /workspace/ # buildkit'
- 'RUN /usr/local/bin/_dockerfile_shell.sh micromamba run -n chembench python -c "import pyscf; from pyscf.solvent import smd; print(''PySCF'', pyscf.__version__, ''SMD_OK'')" # buildkit'
- CMD ["bash"]
