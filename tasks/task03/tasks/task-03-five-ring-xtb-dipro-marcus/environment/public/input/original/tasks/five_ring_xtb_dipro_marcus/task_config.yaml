task_name: five_round_xtb_dipro_marcus_rate_optimization
benchmark_version: '1.3'
fixed_iteration_budget: 5
constraints:
  allowed_elements:
  - C
  - H
  - N
  - O
  - S
  - Se
  - F
  - Cl
  formal_charge: 0
  heavy_atom_count:
    max_exclusive: 50
  molecular_weight:
    max_exclusive: 750.0
  largest_fused_ring_cluster_size: 5
  require_exactly_one_fused_ring_cluster: true
  allow_extra_rings_outside_largest_cluster: false
  fused_ring_shared_atom_threshold: 2
rdkit:
  embedding_random_seed: 61453
  num_conformers: 10
  forcefield: MMFF
  fallback_forcefield: UFF
  max_optimization_iters: 500
xtb:
  enabled: true
  executable: xtb
  gfn: 2
  opt_level: tight
  neutral_charge: 0
  neutral_uhf: 0
  cation_charge: 1
  cation_uhf: 1
  timeout_seconds: 1800
  hartree_to_ev: 27.211386245988
packing:
  model: lowest_energy_slipped_cofacial_dimer_search
  dx_A: 1.5
  dy_A: 0.0
  dz_A: 3.4
  align_by: heavy_atom_principal_axes
  search:
    enabled: true
    dx_values_A:
    - 0.0
    - 1.0
    - 1.5
    - 2.0
    dy_values_A:
    - -1.0
    - 0.0
    - 1.0
    dz_values_A:
    - 3.0
    - 3.2
    - 3.4
    - 3.6
    - 3.8
    - 4.0
    timeout_seconds: 1800
dipro:
  enabled: true
  dipro_parameter: 0.1
  use_absolute_hole_coupling: true
  timeout_seconds: 1800
marcus:
  temperature_K: 300.0
  kB_eV_per_K: 8.617333262145e-05
  hbar_eV_s: 6.582119569e-16
  rate_threshold_s_inv: 100000000000000.0
scoring:
  total_points: 100
  method: hard_constraint_gate_then_continuous_rate
  recommendation_required: true
  allowed_candidate_ids: [R1, R2, R3, R4, R5]
  hard_constraint_failure_score: 0
  missing_or_unknown_recommendation_score: 0
  rate_score_floor_s_inv: 100000000000000.0
  rate_score_ceiling_s_inv: 1000000000000000.0
status_values:
- success
- invalid_smiles
- multiple_components
- non_neutral
- disallowed_elements
- wildcard_or_query_atom
- invalid_fused_ring_core
- size_out_of_range
- duplicate_smiles
- rdkit_embedding_failed
- xtb_neutral_opt_failed
- xtb_cation_opt_failed
- reorganization_energy_failed
- dimer_construction_failed
- dipro_failed
- marcus_rate_failed
