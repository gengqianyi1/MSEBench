schema_version = "1.4"
multi_step_reward_strategy = "final"
# The Harbor final grader recomputes the scientific result from the submitted
# round candidates.  ``result.json`` and ``protocol_state.json`` belonged to
# the retired native-runner contract and are not agent-owned Harbor artifacts.
artifacts = ["/workspace/rounds", "/workspace/final_answer.json"]

[task]
name = "msebench/task-03-five-ring-xtb-dipro-marcus"
version = "2.1.0"
description = "Five-round xTB-DIPRO Marcus molecular design"
authors = [{ name = "Tian Shuangyan" }]
keywords = ["computational_chemistry", "msebench", "harbor"]

[metadata]
source_task_id = "task_03_five_ring_xtb_dipro_marcus"
source_version = "1.3"
domain = "computational_chemistry"
legacy_execution_mode = "native_runner"
legacy_grader_version = "1.3-canonical-result-schema"
migration_status = "harbor-ready"
task_owned_llm = false
protocol_decoupled = true
parity_validated = true
protocol_validated = true
scoring_validated = true
private_boundary_validated = true
oracle_scientifically_validated = true
schema_validated = true
build_validated = true
leakage_validated = true
parity_score_tolerance = 1e-9
required_artifacts = ["final_answer.json"]

release_eligible = true
oracle_status = "verified_harbor"

[environment]
workdir = "/workspace"
network_mode = "no-network"
# Reuse the sealed WSL-built participant image; Harbor must not rebuild from
# micromamba (which would require network access and create an untracked image).
docker_image = "harbor-migration/task03:environment"
build_timeout_sec = 7200.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0

[[steps]]
name = "round-1"
[steps.agent]
timeout_sec = 1800.0
[steps.verifier]
timeout_sec = 60.0
environment_mode = "separate"

[[steps]]
name = "round-2"
[steps.agent]
timeout_sec = 1800.0
[steps.verifier]
timeout_sec = 60.0
environment_mode = "separate"

[[steps]]
name = "round-3"
[steps.agent]
timeout_sec = 1800.0
[steps.verifier]
timeout_sec = 60.0
environment_mode = "separate"

[[steps]]
name = "round-4"
[steps.agent]
timeout_sec = 1800.0
[steps.verifier]
timeout_sec = 60.0
environment_mode = "separate"

[[steps]]
name = "round-5"
[steps.agent]
timeout_sec = 1800.0
[steps.verifier]
timeout_sec = 60.0
environment_mode = "separate"

[[steps]]
name = "recommendation"
[steps.agent]
timeout_sec = 1800.0
[steps.verifier]
timeout_sec = 43200.0
environment_mode = "separate"

[environment.healthcheck]
command = "python -c 'import numpy, rdkit' && xtb --version"
interval_sec = 5.0
timeout_sec = 60.0
retries = 3

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 7200.0
os = "linux"
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
