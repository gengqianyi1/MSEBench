task_id: q1_spherical_agglomeration_cqa
task_name: Coordinated four-window redesign of a SIMULATED quasi-emulsion spherical agglomeration process
  under a controlled-change budget (synthetic simulator; iterative process optimisation with a diagnostic
  tool layer)
task_domain: pharmaceutical development / crystallization and particle engineering (QbD)
task_summary: "A needle-habit drug substance is spherically agglomerated (quasi-emulsion solvent-diffusion\
  \ /\n  bridging-liquid route) in a SYNTHETIC SIMULATOR to make it flowable and directly compressible.\
  \ No\n  experimental data is involved: the four responses are simulator outputs, produced by a mechanistic\n\
  \  model plus a surrogate network fitted to that model with synthetic noise (seed 20260726), and the\n\
  \  mechanism is held on the grading side. All four simulated attributes of the baseline process sit\n\
  \  outside two-sided specification windows at once, each on a different side, so no attribute can be\n\
  \  repaired in isolation. Under a controlled-change budget of 6 weighted change points out of 22\n \
  \ (equivalently: at least 72.7 % of the baseline process must survive), the agent redesigns the twelve\n\
  \  declared process variables over five rounds to maximise the weighted Derringer-Suich desirability\
  \ D\n  over the four windows. Every one of the twelve variables enters all four response models, so\
  \ the\n  objective cannot be evaluated by hand or solved as a system of equations: five rounds of simulated\n\
  \  measurement, plus an optional diagnostic tool layer that reports legality, runnability and change\n\
  \  cost but never a quality attribute, are the only information channels."
baseline_process:
  S1_bridging_liquid: EtOAc
  S2_bridging_ratio_v_w: 0.35
  S3_addition_mode: 30_min
  S4_solids_g_per_L: 100
  S5_tip_speed_m_s: 1.4
  S6_temperature_C: 25
  S7_agglomeration_min: 45
  S8_primary_d50_um: 12
  S9_water_fraction: 0.75
  S10_classification: remove_fines
  S11_drying: 50C_vac_6h
  S12_HPMC_ppm: 0
design_space:
  n_slots: 12
  size_gross: 653184000
  total_change_cost_if_all_changed: 22
  slots:
    S1_bridging_liquid:
      unit: bridging liquid identity
      change_cost: 3
      levels:
      - heptane
      - cyclohexane
      - heptane_EtOAc_1_1
      - toluene
      - MTBE
      - EtOAc
    S2_bridging_ratio_v_w:
      unit: L bridging liquid per kg API (v/w)
      change_cost: 2
      levels:
      - 0.26
      - 0.3
      - 0.35
      - 0.41
      - 0.47
      - 0.55
    S3_addition_mode:
      unit: bridging-liquid addition profile
      change_cost: 1
      levels:
      - one_shot
      - 10_min
      - 30_min
      - 60_min
      - 90_min
      - 3_pulses
    S4_solids_g_per_L:
      unit: g API per L continuous phase
      change_cost: 2
      levels:
      - 40
      - 70
      - 100
      - 140
      - 190
      - 260
    S5_tip_speed_m_s:
      unit: impeller tip speed, m/s
      change_cost: 1
      levels:
