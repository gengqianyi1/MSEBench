      - 40C_vac_12h
      - 50C_vac_6h
      - 60C_vac_4h
      - 40C_stepped_10h
    S12_HPMC_ppm:
      unit: HPMC in the continuous phase, ppm
      change_cost: 3
      levels:
      - 0
      - 100
      - 300
      - 800
  change_cost_scenario_vocabulary: 'SCENARIO VOCABULARY. "of record" below is a property of the INVENTED
    change-control scenario this exercise is set in, not a claim that anything here was filed with a regulator.
    There is no dossier, no registered product and no real process anywhere in this benchmark.

    '
  change_cost_rationale: 'A change is priced by what it costs in regulatory and plant terms, not by how
    much it moves the responses: 3 points for a material of record or a new unit operation (bridging-liquid
    identity, drying programme, introducing an additive), 2 for a quantity of record or a downstream scheme
    (bridging-liquid ratio, solids loading, continuous-phase composition, classification scheme), 1 for
    an in-process set point (addition profile, tip speed, temperature, hold time, primary-crystal grade).'
objective:
  name: derringer_suich_desirability_D
  direction: maximize
  desirability_shape_m: 2.5
  windows:
    d50:
      unit: um, volume-median diameter of the isolated dried agglomerates
      pl: 320.0
      pu: 390.0
      al: 295.0
      au: 415.0
      w: 2.0
      why_two_sided: 'Below: too little spheronisation, flow and die filling still fail. Above: content
        uniformity of the final blend fails and dissolution becomes diffusion-limited inside the agglomerate.

        '
    strength:
      unit: MPa, agglomerate crush strength by micro-compression
      pl: 0.95
      pu: 1.28
      al: 0.75
      au: 1.48
      w: 2.0
      why_two_sided: 'Below: the agglomerates abrade back to fines during drying, transfer and blending.
        Above: they do not deform during compression, so tablet hardness and dissolution both fail.

        '
    porosity:
      unit: dimensionless intra-agglomerate porosity
      pl: 0.352
      pu: 0.385
      al: 0.34
      au: 0.397
      w: 1.0
      why_two_sided: 'Below: entrapped mother liquor cannot be washed out (residual solvent and isomer
        limits) and dissolution slows. Above: the agglomerates are friable and bulk density is too low.

        '
    yield_pct:
      unit: '%, unit yield of isolated dried agglomerates on API basis'
      pl: 89.5
      pu: 92.5
      al: 87.9
      au: 94.1
      w: 1.0
      why_two_sided: 'Below: the step is not economic. Above: the fines were not actually removed, so
        they are carried into the product together with the mother liquor they entrap -- the upper limit
        is the measurable expression of a purity constraint.

        '
constraints:
  change_budget:
    description: 'Weighted controlled-change score against the registered process, summed over the changed
      variables using the per-variable change cost. Changing all twelve costs 22.

      '
    max_cost: 6
    equivalent_minimum_overlap: 0.727273
  boiling_point_margin:
    description: 'Safety margin on the bridging liquid: the agglomeration temperature must be at least
      10 degC below the bridging liquid''s atmospheric boiling point.

      '
    rule: S6_temperature_C <= bp(S1_bridging_liquid) - 10
  just_suspended_speed:
    description: 'Zwietering-type just-suspended criterion: the impeller tip speed must exceed 0.42 *
      (solids / 40 g/L)^0.30 m/s, or the solids are not fully suspended.

      '
    rule: S5_tip_speed_m_s >= 0.42 * (S4_solids_g_per_L / 40)^0.30
  total_solvent:
    description: 'Total solvent charge (continuous phase + bridging liquid + wash), L per kg API: 1000/S4
      + S2 + 2.

      '
    max_L_per_kg: 26.0
  total_process_time:
    description: Bridging-liquid addition + agglomeration hold + drying, hours.
    max_hours: 34.0
  classification_consistency:
    description: Fines recycle is only defined for a scheme that removes fines in the first place.
iteration:
  max_rounds: 5
  candidates_per_round: 1
  note: 'Five rounds, one process per round, fixed budget: the run always uses all five rounds and there
    is no early stop, so every model is scored on the same number of measurements. The score is the best
    usable process over the whole trajectory (src/scoring.py), not the last one, so a model is never punished
    for exploring in a later round.'
  round_completeness:
    complete_requires_all_rounds: true
    round_counts_when: the trajectory holds a parseable candidate for that round
    missing_round_causes:
    - LLM_CALL_FAILURE
    - UNPARSEABLE_SUBMISSION
    - NO_ROUND_RECORD
    rerun_required_missing_rounds: 1
    score_of_incomplete_run: reported as a lower bound in details.json, labelled INCOMPLETE_MULTI_ROUND
    harbor_reward_of_incomplete_run: 0.0
    reward_rule: >-
      The instruction makes all five rounds mandatory, so completeness gates the numeric
      reward instead of merely labelling it. When protocol_completeness.verdict is not
      COMPLETE the verifier writes reward 0.0, whatever the scientific score is. The
      scientific score is still computed and kept in details.json as a lower bound,
      because that is the right diagnostic for how far a run got before it broke -- but a
      lower bound is not a leaderboard number, and a run that stops at round 3 must not
      be indistinguishable from one that spent its whole measurement budget. This rule is
      published here, before any run, so it is a declared protocol and not a threshold
      picked after seeing scores.
    incomplete_run_may_support:
    - this model reached at least this score
    - this instance is not unreachable
    incomplete_run_may_not_support:
    - model ranking
    - complete three-model difficulty evidence
    - saturation or non-saturation of the instance
scoring:
  total_points: 100
  constraint_points: 0
  optimality_points: 100
  bands_withheld: The achievement -> points ladder is grader-side only. The score is a monotone graded
    function of achievement; the thresholds and the points per band are not disclosed to the model, in
    this config, in question.md or in any round's feedback.
feedback:
  return_measured_responses: true
  return_desirability: true
  return_budget_bookkeeping: true
  return_feasibility_violations: true
  return_per_response_window_verdicts: false
  return_per_response_desirability: false
  return_specification_windows: false
  return_reference_value: false
  return_achievement_or_score: false
  return_success_verdict: false
  return_best_so_far: true
data_nature: "SYNTHETIC. Every response in this benchmark is the output of a synthetic process simulator.\
  \ There is\n  no registered product, no filed process and no experimental measurement anywhere in it.\
  \ The baseline\n  process is a designed starting point, not a real process. Evaluation is deterministic:\
  \ no noise is\n  added at evaluation time. A score measures coordinated multi-variable decision-making\
  \ under a change\n  budget with narrow-band numerical feedback, and must NOT be read as evidence about\
  \ real spherical\n  agglomeration performance or as a property of any real material. The full model\
  \ card -- mechanism,\n  coefficients, the synthetic noise distribution, fit statistics, applicability\
  \ domain and limitations\n  -- is a grader-side document (data/MODEL_CARD.md), because a model that\
  \ can read the response\n  mechanism can optimise against the response surface instead of solving the\
  \ process problem."
package_side: public -- model-visible. The reference optimum, the score anchors, the difficulty-gate measurements
  and the response mechanism are NOT in this file or in this package.
