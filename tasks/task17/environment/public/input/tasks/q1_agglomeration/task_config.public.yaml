      - 0.7
      - 0.9
      - 1.4
      - 2.0
      - 2.8
      - 3.6
    S6_temperature_C:
      unit: agglomeration temperature, degC
      change_cost: 1
      levels:
      - 5
      - 15
      - 25
      - 35
      - 45
    S7_agglomeration_min:
      unit: hold time after addition, min
      change_cost: 1
      levels:
      - 10
      - 25
      - 45
      - 75
      - 120
    S8_primary_d50_um:
      unit: primary-crystal volume-median size, um (set upstream by the cooling rate)
      change_cost: 1
      levels:
      - 5
      - 9
      - 12
      - 20
      - 32
    S9_water_fraction:
      unit: water mass fraction of the continuous phase
      change_cost: 2
      levels:
      - 0.55
      - 0.65
      - 0.75
      - 0.85
    S10_classification:
      unit: wet classification / recycle scheme
      change_cost: 2
      levels:
      - none
      - remove_coarse
      - remove_fines
