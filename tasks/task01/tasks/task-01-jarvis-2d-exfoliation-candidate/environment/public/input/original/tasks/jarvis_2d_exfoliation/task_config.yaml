task_name: jarvis_2d_exfoliation_prediction_and_candidate_generation
benchmark_version: 1.3
tool_call_budget_enabled: false
fixed_tool_call_budget: null
reserved_repair_tool_call_budget: 0
maximum_total_tool_calls: null
max_agent_turns: null
max_runtime_per_tool_call_seconds: 900
module_scoring_requirements:
  exact_prediction_coverage: true
  finite_predictions: true
  strict_result_schema: true
  top10_matches_predictions: true
  readable_candidate_library: true
  target_candidate_record_count: 1000
  short_library_scored_with_fixed_denominator: true
  generator_artifacts_present: true
  leakage_invalidates_run: true
  public_evaluator_must_pass: false
dataset:
  public_data_dir: data
  train_file: train.json.gz
  validation_file: validation.json.gz
  test_file: test_public.json.gz
  metadata_file: dataset_metadata.json
  candidate_constraints_file: candidate_generation_constraints.json
  target: exfoliation_energy_mev_atom
  target_unit: meV/atom
  hidden_slices:
    - iid
    - chemical_system_ood
    - invariance
submission:
  result_file: result.json
  predictions_file: predictions.csv
  candidate_library_file: candidate_library.json.gz
  required_prediction_columns:
    - sample_id
    - predicted_exfoliation_energy_mev_atom
  required_candidate_count: 1000
requirements:
  must_use_pymatgen_structure: true
  must_train_constant_baseline: true
  must_train_learned_model: true
  must_perform_invariance_check: true
  must_predict_every_test_sample: true
  must_generate_candidate_library: true
  must_submit_reproducible_generator: true
  external_network_access: false
  workspace_only_file_access: true
  external_pretraining_policy: prohibited
runner:
  public_validation_repair_attempts: 1
scoring:
  total_points: 100
  public_workflow_points: 0
  property_prediction_points: 50
  candidate_library_points: 50
  maximum_compliance_deduction: 6
  integrity_violation_invalidates_run: true
  compliance_deductions:
    schema_and_consistency: 2
    data_audit_accuracy: 1
    validation_evidence: 1
    reproducibility_artifacts: 1
    scientific_interpretation: 1
  property_private_metrics:
    overall_mae: 14
    overall_rmse: 4
    overall_spearman: 4
    ood_mae: 8
    ood_spearman: 4
    hit_rate_10pct: 4
    ndcg_10pct: 4
    low_tail_mae: 2
    high_tail_mae: 2
    invariance_joint_mae: 4
  candidate_metrics:
    combined_structural_quality: 8
    internal_uniqueness: 3
    composition_structural_novelty: 2
    anonymous_prototype_novelty: 8
    composition_structure_diversity: 2
    generation_reproducibility: 2
    selected_chgnet_stability: 25
calibration:
  candidate_thresholds_require_dry_run_calibration: true
  minimum_candidate_generation_runs_per_model: 1
  allowed_tool_call_budgets: []
