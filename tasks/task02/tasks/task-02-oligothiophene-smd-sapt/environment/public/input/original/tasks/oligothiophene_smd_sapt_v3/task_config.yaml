    smiles: ClC(Cl)Cl
    smd_name: chloroform
    xtb_alpb_name: chcl3
  water:
    smiles: O
    smd_name: water
    xtb_alpb_name: water
    role: polar_endpoint
methods:
  formal_single_point:
    program: PySCF
    functional: M05-2X
    basis: 6-31G*
    reference: RKS
    solvation_model: SMD
  gas_conformer_search:
    method: GFN2-xTB
    initial_conformers: 6
    unique_rmsd_threshold_angstrom: 0.5
    retained_energy_window_kcal_mol: 3.0
  conformational_probe:
    method: GFN2-xTB/ALPB
    endpoints:
    - n-hexane
    - water
    max_common_starting_conformers: 3
  explicit_complex:
    search_method: gas-phase GFN2-xTB
    arrangements_per_endpoint: 3
    endpoints:
    - n-hexane
    - water
    decomposition: SAPT0/jun-cc-pVDZ
constants:
  hartree_to_kcal_mol: 627.509474
  hartree_to_ev: 27.211386245988
  coordinate_round_digits: 10
