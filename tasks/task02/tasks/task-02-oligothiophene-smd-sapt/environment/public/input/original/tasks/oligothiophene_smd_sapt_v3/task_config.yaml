task_name: oligothiophene_smd_sapt_evidence_audited_v3_0
tool_call_budget_enabled: false
preferred_tool_call_budget: null
fixed_tool_call_budget: null
tool_call_penalties: {}
molecule:
  repeat_unit_smiles: '[1*]C1=CC=C([2*])S1'
  repeat_unit_connection_rule: next repeat unit 2* connects to previous repeat unit
    1*
  oligomer_length: 2
  charge: 0
  multiplicity: 1
solvents:
  n-hexane:
    smiles: CCCCCC
    smd_name: n-hexane
    xtb_alpb_name: hexane
    role: apolar_endpoint
  1,4-dioxane:
    smiles: O1CCOCC1
    smd_name: 1,4-dioxane
    xtb_alpb_name: dioxane
